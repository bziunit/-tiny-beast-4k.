
name: Tiny Beast Chess Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/chess.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test engine move
        run: |
          python - <<'PY'
          import chess
          from main import TinyBeast

          board = chess.Board()
          engine = TinyBeast()

          move = engine.best_move(
              board,
              depth=2,
              movetime=1.0
          )

          print("MOVE:", move)
          assert move in board.legal_moves
          print("ENGINE OK")
          PY

      - name: Test checkmate
        run: |
          python - <<'PY'
          import chess
          from main import TinyBeast

          board = chess.Board(
              "7k/6Q1/6K1/8/8/8/8/8 b - - 0 1"
          )

          engine = TinyBeast()
          assert board.is_checkmate()
          assert engine.best_move(board) is None

          print("CHECKMATE TEST OK")
          PY

      - name: Test pawn promotion
        run: |
          python - <<'PY'
          import chess

          board = chess.Board(
              "4k3/P7/8/8/8/8/8/4K3 w - - 0 1"
          )

          promotions = [
              move for move in board.legal_moves
              if move.promotion
          ]

          assert len(promotions) == 4
          print("PROMOTION TEST OK")
          PY

      - name: Test UCI
        run: |
          python - <<'PY'
          import subprocess

          commands = (
              "uci\n"
              "isready\n"
              "position startpos\n"
              "go movetime 500\n"
              "quit\n"
          )

          result = subprocess.run(
              ["python", "main.py", "--uci"],
              input=commands,
              capture_output=True,
              text=True,
              timeout=10
          )

          print(result.stdout)
          assert result.returncode == 0
          assert "uciok" in result.stdout
          assert "readyok" in result.stdout
          assert "bestmove" in result.stdout

          print("UCI TEST OK")
          PY

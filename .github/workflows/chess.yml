name: Tiny Beast Chess Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Tiny Beast
        run: |
          python -c "import chess; from main import TinyBeast; e=TinyBeast(depth=2); m=e.choose_move(); print('MOVE:', m); assert m in e.board.legal_moves; print('ENGINE OK')"

      - name: Test UCI
        run: |
          python - <<'PY'
          import subprocess

          engine = subprocess.Popen(
              ["python", "main.py", "--uci"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True
          )

          commands = "uci\nisready\nposition startpos\ngo\n"
          output, _ = engine.communicate(commands + "quit\n", timeout=30)

          print(output)

          assert "uciok" in output
          assert "readyok" in output
          assert "bestmove" in output

          print("UCI TEST OK")
          PY